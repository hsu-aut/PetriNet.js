<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PetriNet.js test page</title>
  <link rel="stylesheet" href="./page.css">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: sans-serif; background: #fff; }
    #canvas { width: 100%; height: 100%; position: relative; }
    /* diagram-js puts its container inside the host element; pin it so the SVG
       fills the viewport and the panels sit where a user would see them. */
    #canvas > .djs-container, #canvas > .djs-container > svg { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="canvas"></div>
  <script type="module" src="./page.js"></script>
</body>
</html>
